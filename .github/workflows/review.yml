# The agent review gate: "suite / policy" is a required check on main. Pull requests get the agent pass (the
# GitHub Copilot CLI on this workflow's own token, billed to the organization: no secret) and the deterministic
# checks; the merge queue reuses the verdict recorded on the pull request.
name: review
on:
  pull_request: { types: [opened, synchronize, reopened, ready_for_review] }
  merge_group:
permissions:
  contents: read   # the reusable workflow raises pull-requests: write on the one job that comments
concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true   # a new push supersedes the review in flight; one paid run per revision
jobs:
  suite:
    uses: public-software/.github/.github/workflows/review.yml@0143b99c390360ed1fd66e6c266ebbd74ad7d4cf # v2.0.0
    permissions:
      contents: read
      pull-requests: write
      copilot-requests: write   # the agent's AI credits go to the organization's budget
