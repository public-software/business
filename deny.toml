# cargo-deny: licence allow-list and the inward-only dependency rule.
[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "OFL-1.1"]
# copyleft is not allowed in the platform and system rings; domain-ring apps may vendor MPL-2.0 only

[bans]
multiple-versions = "warn"
# Dependencies point inward only: spine ← platform ← system ← domain.
# `pub check` enforces ring direction using CATALOG.toml; list explicit bans here if needed.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
